# Publication sur Cloudflare Pages : tests, construction du site, migrations de la base, déploiement.
# INACTIF tant que le secret CLOUDFLARE_API_TOKEN n'existe pas (Settings > Secrets du dépôt) :
# le travail s'arrête alors sans rien faire. Voir BASCULE-CLOUDFLARE.md (à faire avec Viktor).
name: Publier sur Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SAKINA_SITE: ${{ vars.SAKINA_SITE }}
    steps:
      - name: Cloudflare branché ?
        id: actif
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$SAKINA_SITE" ]; then
            echo "Cloudflare pas encore branché (secret CLOUDFLARE_API_TOKEN ou variable SAKINA_SITE absents) : rien à faire."
            echo "actif=non" >> "$GITHUB_OUTPUT"
          else
            echo "actif=oui" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.actif.outputs.actif == 'oui'
      - uses: actions/setup-node@v4
        if: steps.actif.outputs.actif == 'oui'
        with:
          node-version: 22
      - name: Dépendances et navigateur de test
        if: steps.actif.outputs.actif == 'oui'
        run: |
          npm ci || npm install
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Tests (commande de bout en bout, compositeur, accessibilité, référencement)
        if: steps.actif.outputs.actif == 'oui'
        run: npm test
      - name: Construire le site (service de commande branché)
        if: steps.actif.outputs.actif == 'oui'
        run: SAKINA_API= python3 build.py
      - name: Mettre à jour la base
        if: steps.actif.outputs.actif == 'oui'
        run: npx wrangler d1 migrations apply sakina --remote
      - name: Déployer
        if: steps.actif.outputs.actif == 'oui'
        run: npx wrangler pages deploy site --project-name sakina --branch main
